plugins {
    id "com.android.application"
}

android {
    namespace "com.wintrchess.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.wintrchess.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the local debug key so the APK installs directly
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Engine networks are already compressed binaries
    androidResources {
        noCompress += ["wasm"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
